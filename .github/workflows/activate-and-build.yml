name: Activate Unity License & Build APK

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.11f1

jobs:
  request_alf:
    name: Step 1 - Generate .alf file
    runs-on: ubuntu-latest
    outputs:
      alf: ${{ steps.find_alf.outputs.alf }}
    steps:
      - name: Request Activation File
        uses: game-ci/unity-request-activation-file@v2.1.0
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Find .alf file
        id: find_alf
        run: |
          ALF_FILE=$(find . -name "*.alf" -print -quit)
          echo "alf=$ALF_FILE" >> $GITHUB_OUTPUT
          echo "Found: $ALF_FILE"

      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: alf-file
          path: "*.alf"
          retention-days: 1

  acquire_ulf:
    name: Step 2 - Activate license (.alf → .ulf)
    runs-on: ubuntu-latest
    needs: request_alf
    outputs:
      ulf_file: ${{ steps.find_ulf.outputs.ulf }}
    steps:
      - name: Download .alf artifact
        uses: actions/download-artifact@v4
        with:
          name: alf-file

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Find .alf file
        id: find_alf_local
        run: |
          ALF_FILE=$(find . -name "*.alf" -print -quit)
          echo "ALF_FILE=$ALF_FILE" >> $GITHUB_ENV

      - name: Activate the license
        run: |
          unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" "$ALF_FILE"

      - name: Find .ulf file
        id: find_ulf
        run: |
          ULF_FILE=$(find . -name "*.ulf" -print -quit)
          echo "ulf=$ULF_FILE" >> $GITHUB_OUTPUT
          echo "Found: $ULF_FILE"

      - name: Read .ulf content
        id: ulfRead
        uses: juliangruber/read-file-action@v1.1.4
        with:
          path: ${{ steps.find_ulf.outputs.ulf }}

      - name: Set UNITY_LICENSE secret
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'UNITY_LICENSE'
          value: '${{ steps.ulfRead.outputs.content }}'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .ulf artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ulf-file
          path: "*.ulf"
          retention-days: 1

  build:
    name: Step 3 - Build Quest 3 APK
    runs-on: ubuntu-latest
    needs: acquire_ulf
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Quest-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Quest-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          projectPath: .
          buildName: VRMCompanion
          buildsPath: build
          androidExportType: androidPackage
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeystoreAliasPass: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASS }}
          androidKeystoreAlias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          versioning: Semantic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRMCompanion-Quest3.apk
          path: build/**/*.apk
          retention-days: 30
