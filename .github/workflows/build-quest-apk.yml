name: Build Quest 3 APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.11f1
  BUILD_TARGET: Android
  PROJECT_PATH: .

jobs:
  build:
    name: Build APK for Quest 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: |
            Library
            .gradle
          key: Library-${{ hashFiles('Packages/manifest.json') }}-${{ github.sha }}
          restore-keys: |
            Library-

      - name: Unity Build
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.BUILD_TARGET }}
          projectPath: ${{ env.PROJECT_PATH }}
          buildName: VRMCompanion
          buildsPath: build
          androidExportType: apk
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRMCompanion-Quest3-APK
          path: build/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: build/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
