name: Unity License Activation & Auto-Setup

on:
  workflow_dispatch:

jobs:
  acquire_license:
    name: Acquire Unity License (.alf → .ulf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 1: Generate .alf file using Unity Docker image
      - name: Generate .alf activation file
        id: alf
        run: |
          docker run --name unity-activation \
            -e DISPLAY=:1 \
            unityci/editor:2022.3.11f1-webgl-3 \
            bash -c "Xvfb :1 -screen 0 1024x768x24 & sleep 2 && /opt/unity/Editor/Unity -batchmode -nographics -logFile /dev/stdout -createManualActivationFile -quit"
          
          docker cp unity-activation:/Unity_v2022.3.11f1.alf ./Unity_v2022.alf
          docker rm unity-activation
          
          echo "filePath=$(pwd)/Unity_v2022.alf" >> $GITHUB_OUTPUT
          echo "=== ALF generated ==="
          ls -la Unity_v2022.alf

      # Step 2: Install Puppeteer and run custom activation script
      - name: Install Puppeteer
        run: |
          npm install puppeteer
          npx puppeteer browsers install chrome

      - name: Activate Unity License
        id: activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ALF_PATH: ${{ steps.alf.outputs.filePath }}
        run: node scripts/activate-license.js
        continue-on-error: true

      # Step 3: Upload screenshots for debugging
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-screenshots
          path: |
            *.png
            *.ulf
          retention-days: 7
          if-no-files-found: ignore

      # Step 4: Read .ulf file content
      - name: Read .ulf file
        id: ulf
        if: steps.activate.outcome == 'success'
        run: |
          ULF_FILE=$(find . -name "*.ulf" -type f | head -1)
          
          if [ -z "$ULF_FILE" ]; then
            echo "ERROR: No .ulf file found!"
            ls -la
            exit 1
          fi
          
          echo "Found ULF: $ULF_FILE"
          echo "filePath=$ULF_FILE" >> $GITHUB_OUTPUT
          
          CONTENT=$(cat "$ULF_FILE")
          echo "content<<EOFMARKER" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOFMARKER" >> $GITHUB_OUTPUT
          
          echo "=== ULF FILE CONTENT ==="
          cat "$ULF_FILE"
          echo "=== END ULF ==="

      # Step 5: Set UNITY_LICENSE secret automatically
      - name: Update UNITY_LICENSE secret
        if: steps.ulf.outcome == 'success'
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'UNITY_LICENSE'
          value: ${{ steps.ulf.outputs.content }}
          token: ${{ secrets.ACCESS_TOKEN }}

  trigger_build:
    name: Trigger APK Build
    needs: acquire_license
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-quest-apk.yml',
              ref: 'main'
            });
            console.log('Build workflow triggered!');
