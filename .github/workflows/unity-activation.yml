name: Unity License Activation

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate .alf activation file
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity Activation File via Docker
        run: |
          docker run --name unity-activation \
            -e DISPLAY=:1 \
            unityci/editor:2022.3.11f1-webgl-3 \
            bash -c "Xvfb :1 -screen 0 1024x768x24 & sleep 2 && /opt/unity/Editor/Unity -batchmode -nographics -logFile /dev/stdout -createManualActivationFile -quit"
          
          # The .alf file is at /Unity_v2022.3.11f1.alf (includes full version)
          docker cp unity-activation:/Unity_v2022.3.11f1.alf ./Unity_v2022.alf
          docker rm unity-activation
          
          echo "=== ALF file found ==="
          ls -la Unity_v2022.alf
          echo "=== ALF FILE CONTENT ==="
          cat Unity_v2022.alf
          echo ""
          echo "=== END ALF ==="

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: Unity_v2022.alf
          retention-days: 7
