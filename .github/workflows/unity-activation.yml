name: Unity License Activation

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate .alf activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Unity Activation File
        uses: game-ci/unity-request-activation-file@v2
        id: get_alf
        with:
          unityVersion: 2022.3.11f1

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: ${{ steps.get_alf.outputs.filePath }}
          retention-days: 7

      - name: Print ALF content
        run: |
          echo "=== ALF FILE CONTENT ==="
          cat ${{ steps.get_alf.outputs.filePath }}
          echo ""
          echo "=== END ALF ==="
          echo "File path: ${{ steps.get_alf.outputs.filePath }}"
